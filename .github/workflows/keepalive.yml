name: Supabase Keep-Alive

# Tiene sveglio il progetto Supabase free, che viene sospeso dopo 7 giorni
# di inattivita'. Basta una richiesta qualsiasi: qui si fa una lettura di
# una riga sola.
#
# Si usa la ANON KEY, non la service_role: e' la stessa chiave pubblica gia'
# presente in index.html, quindi non c'e' nessun segreto da custodire e il
# workflow non puo' modificare nulla nel database.
#
# GitHub salta spesso le esecuzioni programmate sui runner gratuiti, per
# questo la cadenza e' giornaliera invece che ogni tre giorni: anche
# perdendone qualcuna, si resta comodamente sotto la soglia dei 7 giorni.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lettura di una riga da risultati
        env:
          SUPABASE_URL: https://oykewinjysrgnhdpkabs.supabase.co
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95a2V3aW5qeXNyZ25oZHBrYWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMTAxNTcsImV4cCI6MjA4OTc4NjE1N30.18ntvRaxidMZrxMO9XJuUbThxQYN0h3m5HboUcpqaaU
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            "$SUPABASE_URL/rest/v1/risultati?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY"
          echo ""
          echo "Ping riuscito: il progetto Supabase risulta attivo."
