name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert keep-alive (scrittura reale sul DB)
        env:
          SUPABASE_URL: https://oykewinjysrgnhdpkabs.supabase.co
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail --silent --show-error -X POST \
            "$SUPABASE_URL/rest/v1/keep_alive" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"source":"github-action"}'

      - name: Pulizia righe piu' vecchie di 7 giorni
        env:
          SUPABASE_URL: https://oykewinjysrgnhdpkabs.supabase.co
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          curl --fail --silent --show-error -X DELETE \
            "$SUPABASE_URL/rest/v1/keep_alive?pinged_at=lt.$CUTOFF" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY"
