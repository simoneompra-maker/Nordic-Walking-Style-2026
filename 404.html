<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>L'app si è spostata</title>
<link rel="canonical" href="https://simonetaffarello.github.io/Nordic-Walking-Style-2026/">
<script>
  // Reindirizza mantenendo percorso, parametri e #: cambia solo l'account nell'indirizzo.
  (function () {
    var nuovo = location.href.replace(/^https?:\/\/simoneompra-maker\.github\.io/i, 'https://simonetaffarello.github.io');
    if (nuovo !== location.href) location.replace(nuovo);
    else location.replace('https://simonetaffarello.github.io/Nordic-Walking-Style-2026/');
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://simonetaffarello.github.io/Nordic-Walking-Style-2026/"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f5f4; color: #1c1917; }
  main { max-width: 420px; margin: 16px; padding: 28px 24px; background: #fff; border-radius: 14px;
         box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; line-height: 1.5; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  a { color: #1d4ed8; word-break: break-all; }
  .nota { font-size: 14px; color: #57534e; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1>L'app si è spostata</h1>
  <p>Questa app ha un nuovo indirizzo. Ti stiamo portando lì automaticamente…</p>
  <p>Se non succede nulla, tocca qui:<br><a id="link" href="https://simonetaffarello.github.io/Nordic-Walking-Style-2026/">https://simonetaffarello.github.io/Nordic-Walking-Style-2026/</a></p>
  <p class="nota">Se l'avevi installata sul telefono, eliminala e installala di nuovo dal nuovo indirizzo.</p>
</main>
<script>
  var a = document.getElementById('link');
  var nuovo = location.href.replace(/^https?:\/\/simoneompra-maker\.github\.io/i, 'https://simonetaffarello.github.io');
  if (nuovo !== location.href) a.href = nuovo;
</script>
</body>
</html>
