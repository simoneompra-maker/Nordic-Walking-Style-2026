  {id:'torino',name:'Torino',date:'2026-09-27',circuits:['nord'],jollyFor:['nord'],label:'Nord'},
  {id:'pomezia',name:'Pomezia',date:'2026-03-29',circuits:['cs'],jollyFor:[],label:'Centro-Sud'},
  {id:'tortoreto',name:'Tortoreto',date:'2026-05-23',circuits:['cs'],jollyFor:[],label:'Centro-Sud'},
  {id:'urbisaglia',name:'Urbisaglia',date:'2026-06-07',circuits:['cs'],jollyFor:[],label:'Centro-Sud'},
  {id:'avigliano',name:'Avigliano',date:'2026-09-06',circuits:['cs'],jollyFor:['cs'],label:'Centro-Sud'},
  {id:'tivoli',name:'Tivoli',date:'2026-09-20',circuits:['cs'],jollyFor:[],label:'Centro-Sud'},
  {id:'catania',name:'Catania',date:'2026-03-22',circuits:['sic'],jollyFor:[],label:'Sicilia'},
  {id:'ragusa',name:'Ragusa',date:'2026-05-24',circuits:['sic'],jollyFor:[],label:'Sicilia'},
  {id:'palermo',name:'Palermo',date:'2026-06-13',circuits:['sic'],jollyFor:['sic'],label:'Sicilia'},
  {id:'san-dona',name:"S. Don\u00e0 di Piave",date:'2026-10-18',circuits:['fin'],jollyFor:[],label:'Finalissima'}
];
var CATS=[
  {id:'istruttore-m',name:'Istruttore Maschile',short:'Istr.M',type:'ind'},
  {id:'istruttore-f',name:'Istruttore Femminile',short:'Istr.F',type:'ind'},
  {id:'camminatore-m',name:'Camminatore Maschile',short:'Camm.M',type:'ind'},
  {id:'camminatore-f',name:'Camminatrice Femminile',short:'Camm.F',type:'ind'},
  {id:'coppia-istr',name:'Coppie Istruttori',short:'C.Istr',type:'cop'},
  {id:'coppia-camm',name:'Coppie Camminatori',short:'C.Camm',type:'cop'},
  {id:'coppia-miste',name:'Coppie Miste',short:'C.Miste',type:'cop'}
];
var CIR={
  ti:{name:'Tappa Italia',color:'var(--ti)'},
  nord:{name:'Circuito Nord',color:'var(--nord)'},
  cs:{name:'Centro-Sud',color:'var(--cs)'},

};
var QLIM={
  nord:{def:10,'camminatore-f':15},
  cs:{def:10,'camminatore-f':15},
  sic:{def:5,'camminatore-f':10}
};

var SUPA_URL='https://oykewinjysrgnhdpkabs.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95a2V3aW5qeXNyZ25oZHBrYWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMTAxNTcsImV4cCI6MjA4OTc4NjE1N30.18ntvRaxidMZrxMO9XJuUbThxQYN0h3m5HboUcpqaaU';

var DB={settings:{asdHighlight:'Sile Walking'},results:{}};

function loadSettings(){try{var r=localStorage.getItem('nws2026_settings');if(r)DB.settings=JSON.parse(r);}catch(e){}}
function saveSettings2(){try{localStorage.setItem('nws2026_settings',JSON.stringify(DB.settings));}catch(e){}}

function supaHeaders(){return{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};}

function rKey(s,c){return s+'__'+c;}

async function loadAllResults(){
  try{
    var resp=await fetch(SUPA_URL+'/rest/v1/risultati?select=*',{headers:supaHeaders()});
    var data=await resp.json();
    DB.results={};
    if(Array.isArray(data)){
      data.forEach(function(r){
        DB.results[r.id]={stageId:r.stage_id,catId:r.cat_id,rows:r.rows,savedAt:r.saved_at};
      });
    }
  }catch(e){console.error('loadAllResults error',e);}
}

async function saveRes(s,c,rows){
  var id=rKey(s,c);
  DB.results[id]={stageId:s,catId:c,rows:rows,savedAt:new Date().toISOString()};
  try{
    await fetch(SUPA_URL+'/rest/v1/risultati',{
      method:'POST',
      headers:Object.assign({},supaHeaders(),{'Prefer':'resolution=merge-duplicates'}),
      body:JSON.stringify({id:id,stage_id:s,cat_id:c,rows:rows})
    });
  }catch(e){console.error('saveRes error',e);}
}

function getRes(s,c){return DB.results[rKey(s,c)];}
function hasRes(s,c){return !!DB.results[rKey(s,c)];}

async function deleteAllResults(){
  await fetch(SUPA_URL+'/rest/v1/risultati?id=neq.null',{method:'DELETE',headers:supaHeaders()});
  DB.results={};
}

// ── FIX 1: getStandings con filtro TI rigoroso ───────────────
// ── FIX 5: circuitKeys ora rispetta l'ASD del circuito, non solo il nome ──
// Prima di questo fix, un atleta con ASD di un ALTRO circuito ma che aveva
// gareggiato "fisicamente" in una tappa normale di questo circuito (es. per
// una tappa aperta a tutti come Palermo) veniva comunque considerato come
// "presente nel circuito", bypassando il controllo ASD sulla riga di Tappa
// Italia e facendo così apparire il suo punteggio TI nel circuito sbagliato.
function getStandings(cirId,catId){
  var cat=CATS.find(function(c){return c.id===catId;});
  var stgs=STAGES.filter(function(s){return s.circuits.indexOf(cirId)>=0&&s.id!=='san-dona';});
  var map={};
  // Pre-calcola le chiavi (nome/coppia) di chi ha già risultati nelle tappe NORMALI del circuito
  // E la cui ASD non è esplicitamente assegnata a un circuito diverso.
  // Serve per la TI: se assoc è vuoto, includiamo nella classifica di un circuito solo
  // chi ha disputato almeno una tappa normale di quel circuito con un'ASD coerente.
  var circuitKeys={};
  if(cirId!=='ti'){
    stgs.filter(function(s){return !isTappaItalia(s.id);}).forEach(function(s){
      var r2=getRes(s.id,catId);
      if(!r2)return;
      r2.rows.forEach(function(row2){
        var asdCir2=getASDCircuito(row2.assoc||'');
        // Salta la riga se l'ASD è esplicitamente di un ALTRO circuito
        if(asdCir2!=='nd'&&asdCir2!=='tutti'&&asdCir2!==cirId) return;
        var k=cat.type==='cop'
          ?pairKey(row2.p1,row2.p2)
          :norm(row2.cognome||'')+' '+norm(row2.nome||'');
        circuitKeys[k]=true;
      });
    });
  }
  for(var si=0;si<stgs.length;si++){
    var st=stgs[si];
    var res=getRes(st.id,catId);
    if(!res)continue;
    var jolly=st.jollyFor.indexOf(cirId)>=0;
    for(var ri=0;ri<res.rows.length;ri++){
      var row=res.rows[ri];
      // Filtro per circuito ASD
      if(cirId!=='ti'){
        var asdCir=getASDCircuito(row.assoc||'');
        if(isTappaItalia(st.id)){
          // TI: includi se ha tappe normali nel circuito OPPURE ASD esplicitamente del circuito/'tutti'
          // ASD 'nd' (vuota) senza tappe normali → escludi (circuito non determinabile)
          var rowKey=cat.type==='cop'
            ?pairKey(row.p1,row.p2)
            :norm(row.cognome||'')+' '+norm(row.nome||'');
          if(!circuitKeys[rowKey]){
            // Nessuna tappa normale → serve ASD esplicita del circuito
            if(asdCir!=='tutti'&&asdCir!==cirId) continue;
          }
        } else {
          // Tappe normali: escludi solo se assegnata a un ALTRO circuito noto
          if(asdCir!=='nd'&&asdCir!=='tutti'&&asdCir!==cirId) continue;
        }
      }
      var key=cat.type==='cop'
        ?pairKey(row.p1,row.p2)
        :norm(row.cognome||'')+' '+norm(row.nome||'');
      if(!map[key])map[key]={key:key,display:cat.type==='cop'?pairDisplay(row.p1,row.p2):(row.cognome||'')+' '+(row.nome||''),assoc:row.assoc||'',stages:[],total:0};
      var pts=isTappaItalia(st.id)?posToPointsTI(row.pos):posToPoints(row.pos);
      var used=jolly?pts*2:pts;
      map[key].stages.push({stageId:st.id,stageName:st.name,pts:pts,ptsUsed:used,isJolly:jolly});
      map[key].total+=used;
      map[key].assoc=row.assoc||map[key].assoc;
    }
  }
  var arr=Object.values(map).sort(function(a,b){return b.total-a.total;});
  return arr.map(function(a,i){a.pos=i+1;return a;});
}

function norm(s){return (s||'').trim().toLowerCase();}
function normPerson(s){
  return (s||'').trim().toLowerCase().split(/\s+/).filter(Boolean).sort().join(' ');
}
function pairKey(a,b){
  var na=normPerson(a), nb=normPerson(b);
  return na<=nb ? na+'/'+nb : nb+'/'+na;
}
function pairDisplay(a,b){
  var na=normPerson(a), nb=normPerson(b);
  var da=(a||'').trim(), db=(b||'').trim();
  return na<=nb ? da+' / '+db : db+' / '+da;
}
function levenshtein(a,b){
  a=(a||'').toLowerCase(); b=(b||'').toLowerCase();
  if(a===b)return 0;
  if(!a.length)return b.length;
  if(!b.length)return a.length;
  var m=[];
  for(var i=0;i<=b.length;i++)m[i]=[i];
  for(var j=0;j<=a.length;j++)m[0][j]=j;
  for(var i=1;i<=b.length;i++){
    for(var j=1;j<=a.length;j++){
      if(b.charAt(i-1)===a.charAt(j-1))m[i][j]=m[i-1][j-1];
      else m[i][j]=Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);
    }
  }
  return m[b.length][a.length];
}
function similarity(a,b){
  if(!a||!b)return 0;
  var maxLen=Math.max(a.length,b.length);
  if(maxLen===0)return 1;
  return 1-(levenshtein(a,b)/maxLen);
}
function getAllNamesForCat(catId){
  var cat=CATS.find(function(c){return c.id===catId;});
  if(!cat)return [];
  var names={};
  Object.values(DB.results).forEach(function(res){
    if(res.catId!==catId)return;
    res.rows.forEach(function(row){
      if(cat.type==='cop'){
        var k=pairDisplay(row.p1,row.p2);
        if(k)names[k]=true;
      } else {
        var k=((row.cognome||'')+' '+(row.nome||'')).trim();
        if(k)names[k]=true;
      }
    });
  });
  return Object.keys(names);
}
function findSimilarName(name, catId){
  var existing=getAllNamesForCat(catId);
  var ignored=getIgnoredAnomalies();
  for(var i=0;i<existing.length;i++){
    var ex=existing[i];
    if(ex.toLowerCase()===name.toLowerCase())continue;
    var sim=similarity(ex.toLowerCase(),name.toLowerCase());
    if(sim>=0.85){
      var pair=[name,ex].sort().join('||');
      if(ignored.indexOf(pair)>=0)continue;
      return {similar:ex, score:sim};
    }
  }
  return null;
}
function getIgnoredAnomalies(){
  try{return JSON.parse(localStorage.getItem('nws2026_anomalies_ignored')||'[]');}catch(e){return [];}
}
function saveIgnoredAnomalies(list){
  try{localStorage.setItem('nws2026_anomalies_ignored',JSON.stringify(list));}catch(e){}
}
function ignoreAnomaly(name1,name2){
  var list=getIgnoredAnomalies();
  var pair=[name1,name2].sort().join('||');
  if(list.indexOf(pair)<0){list.push(pair);saveIgnoredAnomalies(list);}
}
function detectAllAnomalies(){
  var ignored=getIgnoredAnomalies();
  var results=[];
  CATS.forEach(function(cat){
    var names=getAllNamesForCat(cat.id);
    for(var i=0;i<names.length;i++){
      for(var j=i+1;j<names.length;j++){
        var a=names[i].toLowerCase(), b=names[j].toLowerCase();
        if(a===b)continue;
        var sim=similarity(a,b);
        if(sim>=0.85){
          var pair=[names[i],names[j]].sort().join('||');
          if(ignored.indexOf(pair)>=0)continue;
          results.push({cat:cat.name,catId:cat.id,name1:names[i],name2:names[j],score:sim});
        }
      }
    }
  });
  return results.sort(function(a,b){return b.score-a.score;});
}
function detectRepeatedNameAnomalies(){
  var ignored=getIgnoredAnomalies();
  var results=[];
  CATS.filter(function(c){return c.type==='ind';}).forEach(function(cat){
    var seen={};
    Object.values(DB.results).forEach(function(res){
      if(res.catId!==cat.id)return;
      res.rows.forEach(function(row){
        var cog=norm(row.cognome||'');
        var nom=norm(row.nome||'');
        if(!cog||!nom)return;
        var cogWords=cog.split(/\s+/).filter(function(w){return w.length>2;});
        var nomWords=nom.split(/\s+/).filter(Boolean);
        var hasRepeat=cogWords.some(function(w){return nomWords.indexOf(w)>=0;});
        if(!hasRepeat)return;
        var fullName=((row.cognome||'')+' '+(row.nome||'')).trim();
        var pair=['__repeat__',fullName].sort().join('||');
        if(ignored.indexOf(pair)>=0)return;
        if(!seen[fullName]){seen[fullName]=true;results.push({cat:cat.name,catId:cat.id,name1:fullName,name2:'__repeat__',isRepeat:true,score:1});}
      });
    });
  });
  return results;
}

async function runOCRMulti(files, stageId, catId){
  var status=document.getElementById('ocr-status');
  var cat=CATS.find(function(c){return c.id===catId;});
  var isCop=cat.type==='cop';
  var allRows=[];
  
  status.innerHTML='<div class="sl"><div class="spin"></div><p style="margin-top:12px;color:var(--tx2)">OCR in corso per '+files.length+' immagine'+(files.length>1?'i':'')+'...</p><p style="font-size:12px;color:var(--tx3);margin-top:4px" id="ocr-page-status">Pagina 1 di '+files.length+'</p></div>';
  
  for(var i=0;i<files.length;i++){
    var pageStatus=document.getElementById('ocr-page-status');
    if(pageStatus) pageStatus.textContent='Pagina '+(i+1)+' di '+files.length;
    
    var b64=await fileToBase64(files[i]);
    try{
      var rows=await ocrRequest(b64, isCop);
      rows.forEach(function(r){
        var exists=allRows.find(function(x){return x.pos===r.pos;});
        if(!exists) allRows.push(r);
      });
    }catch(e){
      console.error('OCR page '+(i+1)+' error:',e);
    }
  }
  
  allRows.sort(function(a,b){return (a.pos||0)-(b.pos||0);});
  
  if(!allRows.length){
    status.innerHTML='<div class="al ae">&#x274C; Nessuna riga trovata in nessuna immagine</div>';
    return;
  }
  
  status.innerHTML='<div class="al ao">&#x2705; '+allRows.length+' righe estratte da '+files.length+' immagine'+(files.length>1?'i':'')+'. <strong>Controlla</strong> prima di confermare.</div>';
  showModal(allRows, stageId, catId);
}

function fileToBase64(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(e){resolve(e.target.result.split(',')[1]);};
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function ocrRequest(b64, isCop){
  var resp=await fetch('https://oykewinjysrgnhdpkabs.supabase.co/functions/v1/gemini-ocr',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({image:b64,isCoppia:isCop})
  });
  var data=await resp.json();
  if(data.error) throw new Error(data.error);
  return data.rows||[];
}

function parseLines(lines,isCop){
  var rows=[];
  for(var li=0;li<lines.length;li++){
    var line=lines[li];
    var words=(line.words||[]).filter(function(w){return (w.confidence||0)>25;}).map(function(w){return w.text.trim().replace(/[|{}\[\]]/g,'').trim();}).filter(Boolean);
    if(words.length<4)continue;
    var posStr=words[0].replace(/[^0-9]/g,'');
    var pos=parseInt(posStr);
    if(isNaN(pos)||pos<1||pos>300)continue;
    var ptsIdx=-1,ptsStr='';
    for(var i=words.length-1;i>=2;i--){
      var t=words[i].replace(/[^0-9,.]/g,'');
      if(/\d{3,}[,.]\d{3,}/.test(t)||/\d{2,}[,.]\d{4,}/.test(t)){ptsStr=words[i];ptsIdx=i;break;}
    }
    if(ptsIdx<0){ptsStr=words[words.length-1];ptsIdx=words.length-1;}
    var totIdx=-1,totStr='';
    for(var j=ptsIdx-1;j>=1;j--){
      var tj=words[j].replace(/[^0-9]/g,'');
      if(/^\d{2,3}$/.test(tj)){totStr=tj;totIdx=j;break;}
    }
    if(totIdx<0){totIdx=ptsIdx-1;totStr=words[ptsIdx-1]||'';}
    var mid=words.slice(1,totIdx>0?totIdx:ptsIdx);
    var tot=parseInt(totStr)||0;
    var assocStart=mid.length;
    for(var k=0;k<mid.length;k++){
      var up=mid[k].toUpperCase();
      var found=false;
      for(var ki=0;ki<ASD_KW.length;ki++){if(up.indexOf(ASD_KW[ki])>=0){found=true;break;}}
      if(found){assocStart=k;break;}
    }
    if(assocStart===mid.length&&mid.length>(isCop?6:3)){assocStart=isCop?Math.max(4,mid.length-3):Math.max(2,mid.length-2);}
    var namePart=mid.slice(0,assocStart);
    var assoc=mid.slice(assocStart).join(' ');
    if(isCop){var h=Math.ceil(namePart.length/2);rows.push({pos:pos,p1:namePart.slice(0,h).join(' '),p2:namePart.slice(h).join(' '),assoc:assoc,tot:tot,pts:ptsStr});}
    else{rows.push({pos:pos,cognome:namePart[0]||'',nome:namePart.slice(1).join(' '),assoc:assoc,tot:tot,pts:ptsStr});}
  }
  return rows;
}

var _rows=[],_stg='',_cat='';

function showModal(rows,stageId,catId){
  _rows=JSON.parse(JSON.stringify(rows));_stg=stageId;_cat=catId;

  var cat=CATS.find(function(c){return c.id===catId;});
  document.getElementById('mt').textContent='Revisione: '+stage.name+' \u2013 '+cat.name;
  document.getElementById('mbody').innerHTML=buildRevTable(_rows,cat.type==='cop');
  document.getElementById('mfoot').innerHTML='<button class="btn bs2" onclick="closeModal()">Annulla</button><button class="btn bp" onclick="confirmSave()">&#x2705; Conferma e Salva</button>';

}

function buildRevTable(rows,isCop){
  var cols=isCop?['pos','p1','p2','assoc','tot','pts']:['pos','cognome','nome','assoc','tot','pts'];
  var hdrs=isCop?['POS','Partecipante 1','Partecipante 2','Associazione','Tot. Giudici','Punti']:['POS','Cognome','Nome','Associazione','Tot. Giudici','Punti'];
  var anomalies=rows.map(function(r){
    var name=isCop?pairDisplay(r.p1,r.p2):((r.cognome||'')+' '+(r.nome||'')).trim();
    if(!name)return null;
    return findSimilarName(name, _cat);
  });
  var anomCount=anomalies.filter(function(a){return a;}).length;
  var html='<p style="color:var(--tx2);font-size:12px;margin-bottom:12px">Clicca su qualsiasi cella per modificarla prima di salvare.</p>';
  if(anomCount>0){
    html+='<div class="al" style="background:#fff7e6;border:1px solid #fbbf24;color:#92400e;margin-bottom:12px">&#x26A0;&#xFE0F; <strong>'+anomCount+' nome'+(anomCount>1?'i':'')+' simile'+(anomCount>1?'i':'')+'</strong> a voci gi&#xE0; presenti. Verifica per evitare duplicati.</div>';
  }
  html+='<div class="tw"><table><thead><tr>'+hdrs.map(function(h){return '<th>'+h+'</th>';}).join('')+'<th></th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var anom=anomalies[i];
    var rowStyle=anom?' style="background:#fff7e6"':'';
    html+='<tr'+rowStyle+'>'+cols.map(function(c,j){
      var warn='';
      if(anom&&((isCop&&(c==='p1'||c==='p2'))||(!isCop&&(c==='cognome'||c==='nome')))){
        if((isCop&&c==='p1')||(!isCop&&c==='cognome')){
          warn=' <span title="Simile a: '+anom.similar+' ('+Math.round(anom.score*100)+'%)" style="color:#f59e0b;cursor:help">&#x26A0;&#xFE0F;</span>';
        }
      }
      return '<td><input class="ec" style="'+(j===0||j===4?'width:50px':j===5?'width:110px':'')+'" data-row="'+i+'" data-col="'+c+'" value="'+(r[c]||'')+'" onchange="_rows['+i+'][\''+c+'\']=this.value">'+warn+'</td>';
    }).join('')+'<td><span class="rd" onclick="delRow('+i+')">&#x1F5D1;</span></td></tr>';
  });
  html+='</tbody></table></div><button class="btn bg bsm" style="margin-top:12px" onclick="addRow()">+ Aggiungi riga</button>';
  return html;
}

function delRow(i){_rows.splice(i,1);var cat=CATS.find(function(c){return c.id===_cat;});document.getElementById('mbody').innerHTML=buildRevTable(_rows,cat.type==='cop');}

          ' '+badge+

    }).join('');
    return '<div class="card" style="margin:0;border-top:3px solid '+c.color+'">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
        '<span style="font-family:var(--fh);font-weight:700;font-size:14px;color:'+c.color+'">'+c.name+'</span>'+

    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">'+colHtml+'</div>'+
    '</div>';
}

    )+

function selectASDSearch(asdName){
  fnState.asdQuery=asdName;
  fnState.asdSelected=asdName;
  renderFin();
}

function buildASDQualTable(asdName){
  var found=[];
  ['nord','cs','sic'].forEach(function(cirId){
    CATS.forEach(function(cat){
      var rows=getStandings(cirId,cat.id);
      var qlim=QLIM[cirId]?QLIM[cirId][cat.id]||QLIM[cirId].def:10;
      rows.filter(function(r){
        return r.assoc.toLowerCase().indexOf(asdName.toLowerCase())>=0;
      }).forEach(function(r){
        found.push(Object.assign({},r,{cirId:cirId,catName:cat.name,catId:cat.id,qlim:qlim}));
      });
    });
  });
  if(!found.length){
    return '<div class="se" style="padding:24px 0">Nessun atleta trovato per questa ASD nei dati caricati.</div>';
  }
  found.sort(function(a,b){
    var aQ=a.pos<=a.qlim?0:a.pos<=a.qlim+5?1:2;
    var bQ=b.pos<=b.qlim?0:b.pos<=b.qlim+5?1:2;
    if(aQ!==bQ)return aQ-bQ;
    return a.pos-b.pos;
  });
  var rows=found.map(function(r){
    return '<tr>'+
      '<td style="padding:8px 12px;font-weight:600">'+r.display+'</td>'+
      '<td style="padding:8px 12px"><span style="color:'+CIR[r.cirId].color+';font-size:12px;font-weight:600">'+CIR[r.cirId].name+'</span></td>'+
      '<td style="padding:8px 12px;font-size:12px;color:var(--tx2)">'+r.catName+'</td>'+
      '<td style="padding:8px 12px;text-align:center"><span class="pb p'+(r.pos<4?r.pos:'x')+'" style="width:22px;height:22px;font-size:12px">'+r.pos+'</span></td>'+
      '<td style="padding:8px 12px;text-align:right;font-family:var(--fh);font-weight:700;color:'+CIR[r.cirId].color+'">'+r.total+'</td>'+
      '<td style="padding:8px 12px">'+
        (r.pos<=r.qlim
          ?'<span class="qy">&#x2705; QUALIFICATO</span>'
          :r.pos<=r.qlim+5
            ?'<span class="qm">&#x23F3; IN ZONA</span>'
            :'<span class="qn">&mdash;</span>')+
      '</td>'+
      '</tr>';
  }).join('');
  return '<div class="tw"><table width="100%">'+
    '<thead><tr>'+
      '<th>Atleta / Coppia</th>'+
      '<th>Circuito</th>'+
      '<th>Categoria</th>'+
      '<th style="text-align:center">Pos.</th>'+
      '<th style="text-align:right">Totale</th>'+
      '<th>Finalissima</th>'+
    '</tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    '</table></div>';
}

var atState={query:'',selected:null};

function getAllAthletes(){
  var indCats=CATS.filter(function(c){return c.type==='ind';});
  var map={};
  indCats.forEach(function(cat){
    Object.values(DB.results).forEach(function(res){
      if(res.catId!==cat.id)return;
      res.rows.forEach(function(row){
        var key=norm(row.cognome||'')+' '+norm(row.nome||'')+'__'+cat.id;
        if(!map[key]){
          map[key]={
            key:key,
            display:((row.cognome||'')+' '+(row.nome||'')).trim(),
            cognome:row.cognome||'',
            nome:row.nome||'',
            assoc:row.assoc||'',
            catId:cat.id,
            catName:cat.name
          };
        } else if(row.assoc) {
          map[key].assoc=row.assoc;
        }
      });
    });
  });
  return Object.values(map).sort(function(a,b){return a.display.localeCompare(b.display);});
}

function searchAthletes(query){
  var q=(query||'').trim().toLowerCase();
  var all=getAllAthletes();
  if(!q)return all.slice(0,50);
  return all.filter(function(a){
    return a.display.toLowerCase().indexOf(q)>=0 || a.assoc.toLowerCase().indexOf(q)>=0;
  }).slice(0,30);
}

function getAthleteHistory(athlete){
  var history=[];
  STAGES.forEach(function(st){
    if(st.id==='san-dona')return;
    var res=getRes(st.id,athlete.catId);
    if(!res)return;
    for(var i=0;i<res.rows.length;i++){
      var r=res.rows[i];
      if(norm(r.cognome||'')===norm(athlete.cognome)&&norm(r.nome||'')===norm(athlete.nome)){
        var cirId=getAthleteCircuit(athlete.assoc)||st.circuits[0];
        var ptsPos=isTappaItalia(st.id)?posToPointsTI(r.pos):posToPoints(r.pos);
        var jolly=st.jollyFor.indexOf(cirId)>=0;
        history.push({
          stageId:st.id,
          stageName:st.name,
          stageDate:st.date,
          circuits:st.circuits,
          jollyFor:st.jollyFor,
          pos:r.pos,
          tot:r.tot,
          pts:r.pts,
          ptsNum:ptsPos,
          ptsUsed:jolly?ptsPos*2:ptsPos,
          isJolly:jolly
        });
        break;
      }
    }
  });
  return history;
}

function getAthleteCircuit(asd){
  var c=getASDCircuito(asd);
  if(c==='nd'||c==='tutti')return null;
  return c;
}

function getAthleteCurrentRank(athlete){
  var cir=getAthleteCircuit(athlete.assoc);
  if(!cir)return null;
  var standings=getStandings(cir,athlete.catId);
  var key=norm(athlete.cognome)+' '+norm(athlete.nome);
  for(var i=0;i<standings.length;i++){
    if(standings[i].key===key){
      return {pos:standings[i].pos,total:standings[i].total,circuit:cir,allStandings:standings};
    }
  }
  return null;
}

function getQualThreshold(catId, cirId){
  if(catId==='camminatore-f'){
    if(cirId==='sic')return 10;
    return 15;
  }
  if(cirId==='sic')return 5;
  return 10;
}

function renderAtletaList(){

}

function selectAtleta(elem){
  var key=elem.dataset.key;
  var all=getAllAthletes();
  var found=all.find(function(a){return a.key===key;});
  if(found){
    atState.selected=found;
    renderAtleta();
  }
}

function buildAtletaDetail(athlete){
  var history=getAthleteHistory(athlete);
  var rank=getAthleteCurrentRank(athlete);
  var cir=getAthleteCircuit(athlete.assoc);
  
  var nStages=history.length;
  var avgPos=nStages?(history.reduce(function(s,h){return s+(+h.pos||0);},0)/nStages).toFixed(1):'-';
  var bestPos=nStages?Math.min.apply(null,history.map(function(h){return +h.pos||999;})):'-';
  var worstPos=nStages?Math.max.apply(null,history.map(function(h){return +h.pos||0;})):'-';
  
  var headerHtml='<div class="card" style="margin-bottom:16px;border-left:4px solid #8b5cf6">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">'+
    '<div>'+
    '<div style="font-family:var(--fh);font-weight:800;font-size:24px;color:var(--tx)">'+athlete.display+'</div>'+
    '<div style="color:var(--tx2);font-size:14px;margin-top:4px">'+athlete.assoc+'</div>'+
    '<div style="margin-top:8px"><span style="display:inline-block;padding:3px 10px;background:rgba(139,92,246,.1);color:#8b5cf6;border-radius:12px;font-size:11px;font-weight:600">'+athlete.catName+'</span>'+
    (cir?' <span style="display:inline-block;padding:3px 10px;background:'+CIR[cir].color+'22;color:'+CIR[cir].color+';border-radius:12px;font-size:11px;font-weight:600;margin-left:6px">'+CIR[cir].name+'</span>':'')+
    '</div></div>'+
    (rank?'<div style="text-align:right"><div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px">Pos. classifica</div><div style="font-family:var(--fh);font-weight:800;font-size:36px;color:'+CIR[cir].color+';line-height:1">'+rank.pos+'<span style="font-size:18px">&deg;</span></div><div style="font-size:13px;color:var(--tx2);margin-top:2px">'+rank.total+' pt</div></div>':'')+
    '</div></div>';
  
  var statsHtml='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px">'+
    '<div class="card" style="margin:0;text-align:center"><div style="font-size:11px;color:var(--tx3);text-transform:uppercase">Tappe</div><div style="font-family:var(--fh);font-weight:800;font-size:32px;color:var(--tx)">'+nStages+'</div></div>'+
    '<div class="card" style="margin:0;text-align:center"><div style="font-size:11px;color:var(--tx3);text-transform:uppercase">Pos. media</div><div style="font-family:var(--fh);font-weight:800;font-size:32px;color:var(--tx)">'+avgPos+'</div></div>'+
    '<div class="card" style="margin:0;text-align:center"><div style="font-size:11px;color:var(--tx3);text-transform:uppercase">Migliore</div><div style="font-family:var(--fh);font-weight:800;font-size:32px;color:var(--grn)">'+bestPos+(typeof bestPos==='number'?'&deg;':'')+'</div></div>'+
    '<div class="card" style="margin:0;text-align:center"><div style="font-size:11px;color:var(--tx3);text-transform:uppercase">Peggiore</div><div style="font-family:var(--fh);font-weight:800;font-size:32px;color:var(--tx2)">'+worstPos+(typeof worstPos==='number'?'&deg;':'')+'</div></div>'+
    '</div>';
  
  var historyHtml='';
  if(history.length){
    var histRows=history.map(function(h){
      var jollyMark=h.isJolly?' <span style="color:var(--red2);font-size:10px;font-weight:700">JOLLY x2</span>':'';
      var medal=h.pos<=3?(h.pos===1?'&#x1F947;':h.pos===2?'&#x1F948;':'&#x1F949;'):'';
      var tiMark=isTappaItalia(h.stageId)?' <span style="color:var(--ti);font-size:10px;font-weight:700">TI</span>':'';
      return '<tr><td style="padding:8px 12px">'+fmtDs(h.stageDate)+'</td>'+
        '<td style="padding:8px 12px;font-weight:500">'+h.stageName+tiMark+jollyMark+'</td>'+
        '<td style="padding:8px 12px;text-align:center"><strong>'+h.pos+'&deg;</strong> '+medal+'</td>'+
        '<td style="padding:8px 12px;text-align:right;color:var(--tx3)">'+h.ptsNum+'</td>'+
        '<td style="padding:8px 12px;text-align:right;color:var(--red);font-weight:600">'+h.ptsUsed+'</td>'+
        '</tr>';
    }).join('');
    historyHtml='<div class="card" style="margin-bottom:16px"><div class="ct">&#x1F4CA; Storico tappe</div><div class="tw"><table width="100%"><thead><tr><th style="text-align:left">Data</th><th style="text-align:left">Tappa</th><th style="text-align:center">Pos.</th><th style="text-align:right">Pt pos.</th><th style="text-align:right">Pt usati</th></tr></thead><tbody>'+histRows+'</tbody></table></div></div>';
  }
  
  var finHtml='';
  if(rank&&cir){
    var threshold=getQualThreshold(athlete.catId,cir);
    var qualified=rank.pos<=threshold;
    var standings=rank.allStandings;
    
    var distanceHtml='';
    if(qualified){
      var nextBehind=standings[threshold];
      if(nextBehind){
        var gap=(rank.total-nextBehind.total);
        distanceHtml='<div style="margin-top:8px;font-size:13px;color:var(--tx2)">Vantaggio sul '+(threshold+1)+'&deg;: <strong style="color:var(--grn)">+'+gap+' pt</strong></div>';
      }
    } else {
      var cutoff=standings[threshold-1];
      if(cutoff){
        var gap=(cutoff.total-rank.total);
        distanceHtml='<div style="margin-top:8px;font-size:13px;color:var(--tx2)">Per qualificarti devi recuperare: <strong style="color:var(--red)">'+gap+' pt</strong> sul '+threshold+'&deg; posto</div>';
      }
    }
    
    var stgs=STAGES.filter(function(s){return s.circuits.indexOf(cir)>=0&&s.id!=='san-dona';});
    var done={};history.forEach(function(h){done[h.stageId]=true;});
    var remaining=stgs.filter(function(s){return !done[s.id];});
    
    var remHtml='';
    if(remaining.length){
      remHtml='<div style="margin-top:12px;font-size:13px;color:var(--tx2)">Tappe rimanenti: '+remaining.map(function(s){return s.name+(s.jollyFor.indexOf(cir)>=0?' (Jolly)':'');}).join(', ')+'</div>';
    } else {
      remHtml='<div style="margin-top:12px;font-size:13px;color:var(--tx3)">Tutte le tappe del circuito disputate</div>';
    }
    
    finHtml='<div class="card" style="border-left:4px solid '+(qualified?'var(--grn)':'var(--red)')+'">'+
      '<div class="ct">&#x1F3C6; Qualificazione Finalissima</div>'+
      '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">'+
      '<div style="font-size:32px">'+(qualified?'&#x2705;':'&#x26A0;&#xFE0F;')+'</div>'+
      '<div style="flex:1;min-width:200px">'+
      '<div style="font-weight:600;font-size:15px;color:'+(qualified?'var(--grn)':'var(--red)')+'">'+(qualified?'Qualificato':'Fuori qualificazione')+'</div>'+
      '<div style="font-size:13px;color:var(--tx2);margin-top:2px">Posizione attuale '+rank.pos+'&deg; &middot; Soglia: top '+threshold+'</div>'+
      distanceHtml+
      remHtml+
      '</div></div></div>';
  } else if(!cir) {
    finHtml='<div class="al ai">L\'ASD di questo atleta non e ancora stata assegnata a un circuito. Vai nella tab <strong>ASD</strong> per assegnarla.</div>';
  }
  
  return headerHtml+statsHtml+historyHtml+finHtml;
}

// ── PUNTEGGI POSIZIONE ────────────────────────────────────────
var POS_POINTS=[100,95,90,85,80,75,70,65,60,55];
function posToPoints(pos){
  if(pos<=0)return 0;
  if(pos<=10)return POS_POINTS[pos-1];
  return Math.max(1, 54-(pos-11));
}

function posToPointsTI(pos){
  if(pos<=0)return 0;
  return Math.max(1, 101-pos);
}

function isTappaItalia(stageId){ return stageId==='bologna-ti'; }

// ── CLASSIFICA ASD PER CIRCUITO ──────────────────────────────
// FIX 6: getASDCircuitStandings tiene solo le MIGLIORI 3 TAPPE per ASD (regolamento punto 26:
// "calcolando i migliori punteggi di 3 tappe per tutti e i 3 circuiti"), invece di sommare
// tutte le tappe disputate. Per la Sicilia (3 tappe totali) l'effetto è nullo; per Nord/Centro-Sud
// (5 tappe totali) vengono scartate le 2 tappe con punteggio più basso per ciascuna ASD.
function getASDCircuitStandings(cirId){
  var indCats=CATS.filter(function(c){return c.type==='ind';});
  // La Tappa Italia È una tappa a tutti gli effetti di ogni circuito (circuits:['ti','nord','cs','sic']).
  // I punti TI confluiscono nel circuito di appartenenza dell'ASD (filtro getASDCircuito più sotto).
  // Solo la Finalissima è esclusa dai circuiti.
  var stgs=STAGES.filter(function(s){
    return s.circuits.indexOf(cirId)>=0&&s.id!=='san-dona';
  });
  // asdStagePts[canon] = array dei punti ottenuti da quell'ASD in ciascuna tappa disputata
  var asdStagePts={};

  for(var si=0;si<stgs.length;si++){
    var st=stgs[si];
    var isJolly=st.jollyFor.indexOf(cirId)>=0;
    // NB: nella classifica ASD a squadre TUTTE le tappe (Tappa Italia inclusa) usano la scala
    // standard 100/95/90/85… (punto 23). La scala 100/99/98… del punto 24 vale solo per le
    // classifiche individuali e a coppie, non per le squadre.
    // Group athletes by ASD and category for this stage
    var stageData={};
    for(var ci=0;ci<indCats.length;ci++){
      var cat=indCats[ci];
      var res=getRes(st.id,cat.id);
      if(!res)continue;
      for(var ri=0;ri<res.rows.length;ri++){
        var row=res.rows[ri];
        var asd=row.assoc||'';
        if(!asd)continue;
        var ac=getASDCircuito(asd);
        if(ac!=='nd'&&ac!=='tutti'&&ac!==cirId)continue;
        var canon=getASDCanonicalName(asd);
        if(!stageData[canon])stageData[canon]={};
        if(!stageData[canon][cat.id])stageData[canon][cat.id]=[];
        stageData[canon][cat.id].push(parseInt(row.pos)||0);
      }
    }
    // Per ASD: best per category gets full points, others get 10 (top10) or 5 (11th+)
    Object.keys(stageData).forEach(function(canon){
      var stagePts=0;
      indCats.forEach(function(cat){
        var poss=stageData[canon][cat.id]||[];
        if(!poss.length)return;
        poss.sort(function(a,b){return a-b;});
        stagePts+=posToPoints(poss[0]);
        for(var k=1;k<poss.length;k++){stagePts+=(poss[k]<=10?10:5);}
      });
      if(isJolly)stagePts*=2;
      if(!asdStagePts[canon])asdStagePts[canon]=[];
      asdStagePts[canon].push(stagePts);
    });
  }

  // Per ogni ASD, tieni solo le migliori 3 tappe (o tutte se sono meno di 3)
  var asdMap={};
  Object.keys(asdStagePts).forEach(function(canon){
    var pts=asdStagePts[canon].slice().sort(function(a,b){return b-a;});
    var best3=pts.slice(0,3);
    var total=best3.reduce(function(s,p){return s+p;},0);
    asdMap[canon]={asd:canon,total:total};
  });

  return Object.values(asdMap).sort(function(a,b){return b.total-a.total;}).map(function(a,i){a.pos=i+1;return a;});
}

// ── CLASSIFICA ASD NAZIONALE ─────────────────────────────────
// Single-stage helper: best per category gets full points, others 10/5
function getASDStagePts(stageId,useTiScale){
  var indCats=CATS.filter(function(c){return c.type==='ind';});
  var stageData={};
  for(var ci=0;ci<indCats.length;ci++){
    var cat=indCats[ci];
    var res=getRes(stageId,cat.id);
    if(!res)continue;
    for(var ri=0;ri<res.rows.length;ri++){
      var row=res.rows[ri];
      var asd=row.assoc||'';
      if(!asd)continue;
      var canon=getASDCanonicalName(asd);
      if(!stageData[canon])stageData[canon]={};
      if(!stageData[canon][cat.id])stageData[canon][cat.id]=[];
      stageData[canon][cat.id].push(parseInt(row.pos)||0);
    }
  }
  var result={};
  Object.keys(stageData).forEach(function(canon){
    var stagePts=0;
    indCats.forEach(function(cat){
      var poss=stageData[canon][cat.id]||[];
      if(!poss.length)return;
      poss.sort(function(a,b){return a-b;});
      stagePts+=(useTiScale?posToPointsTI(poss[0]):posToPoints(poss[0]));
      for(var k=1;k<poss.length;k++){stagePts+=(poss[k]<=10?10:5);}
    });
    result[canon]=stagePts;
  });
  return result;
}

function getASDNationalStandings(){
  var asdMap={};
  // 1. Somma le classifiche ASD dei 3 circuiti.
  //    NB: ogni circuito include già la Tappa Italia tra le sue tappe (best-3 applicato),
  //    quindi la TI NON va risommata qui, altrimenti verrebbe contata due volte.
  ['nord','cs','sic'].forEach(function(cirId){
    getASDCircuitStandings(cirId).forEach(function(r){
      if(!asdMap[r.asd])asdMap[r.asd]={asd:r.asd,total:0};
      asdMap[r.asd].total+=r.total;
    });
  });
  // 2. Finalissima (standard scale; no jolly) — unica tappa esclusa dai circuiti
  var finPts=getASDStagePts('san-dona',false);
  Object.keys(finPts).forEach(function(asd){
    if(!asdMap[asd])asdMap[asd]={asd:asd,total:0};
    asdMap[asd].total+=finPts[asd];
  });
  return Object.values(asdMap).sort(function(a,b){return b.total-a.total;}).map(function(a,i){a.pos=i+1;return a;});
}

var ASD_MAP = {};    // asd_name -> circuito
var ASD_CANON = {};  // asd_name -> nome_canonico
var _asdGroups = []; // detected similarity groups

async function loadASDMap(){
  try{
    var resp=await fetch(SUPA_URL+'/rest/v1/asd_circuiti?select=*',{headers:supaHeaders()});
    var data=await resp.json();
    ASD_MAP={};ASD_CANON={};
    if(Array.isArray(data)) data.forEach(function(r){
      ASD_MAP[r.asd_name]=r.circuito;
      ASD_CANON[r.asd_name]=r.nome_canonico||r.asd_name;
    });
  }catch(e){console.error('loadASDMap error',e);}
}

async function saveASDCircuito(asdName, circuito){
  ASD_MAP[asdName]=circuito;
  try{
    await fetch(SUPA_URL+'/rest/v1/asd_circuiti',{
      method:'POST',
      headers:Object.assign({},supaHeaders(),{'Prefer':'resolution=merge-duplicates'}),
      body:JSON.stringify({asd_name:asdName,circuito:circuito})
    });
  }catch(e){console.error('saveASDCircuito error',e);}
}

async function saveASDCanonical(asdName, nomeCanon){
  ASD_CANON[asdName]=nomeCanon||asdName;
  try{
    await fetch(SUPA_URL+'/rest/v1/asd_circuiti',{
      method:'POST',
      headers:Object.assign({},supaHeaders(),{'Prefer':'resolution=merge-duplicates'}),
      body:JSON.stringify({asd_name:asdName,nome_canonico:nomeCanon||null})
    });
  }catch(e){console.error('saveASDCanonical error',e);}
}

function getAllASD(){
  var asdSet={};
  var indIds=CATS.filter(function(c){return c.type==='ind';}).map(function(c){return c.id;});
  Object.values(DB.results).forEach(function(res){
    if(indIds.indexOf(res.catId)<0)return;
    res.rows.forEach(function(row){
      var a=row.assoc||'';
      if(a) asdSet[a]=true;
    });
  });
  return Object.keys(asdSet).sort();
}

function getASDCircuito(asdName){
  return ASD_MAP[asdName]||'nd';
}

function getASDCanonicalName(asdName){
  if(!asdName)return asdName;
  return ASD_CANON[asdName]||asdName;
}

// Alcuni gruppi rilevati come "simili" sono in realtà ASD diverse

// Non potendo essere unificati, verrebbero riproposti all'infinito:
// l'utente può marcarli come ignorati e non li rivedrà più.
function asdGroupKey(members){
  return members.slice().sort().join('||');
}
function getIgnoredASDGroups(){
  try{return JSON.parse(localStorage.getItem('nws2026_asd_groups_ignored')||'[]');}catch(e){return [];}
}
function saveIgnoredASDGroups(list){
  try{localStorage.setItem('nws2026_asd_groups_ignored',JSON.stringify(list));}catch(e){}
}
function ignoreASDGroup(idx){
  var g=_asdGroups[idx];if(!g)return;
  var key=asdGroupKey(g.members);
  var list=getIgnoredASDGroups();
  if(list.indexOf(key)<0){list.push(key);saveIgnoredASDGroups(list);}
  renderASD();
}
function resetIgnoredASDGroups(){
  if(!confirm('Mostrare di nuovo tutti i gruppi ignorati?'))return;
  saveIgnoredASDGroups([]);
  renderASD();
}

function detectASDGroups(){
  var all=getAllASD();
  function normASD(s){
    return s.toLowerCase().replace(/['''`]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  }
  var STOP=['asd','aps','nw','nordic','walking','sport','club','team','del','di','da','le','la'];
  // FIX 7: asdSim non ripiega più sulla similarità grezza (lev) quando non ci sono
  // abbastanza parole significative in comune. Prima, nomi brevi con lo stesso prefisso
  // generico (es. "ASD Atletica Gorizia" / "ASD Atletica Cibeno") potevano superare la
  // soglia di unione (0.5) solo per la somiglianza letterale, fondendo per errore ASD
  // completamente diverse. Ora, sotto soglia 0.70 di somiglianza letterale, l'unione
  // avviene SOLO se condividono almeno 2 parole distintive con Jaccard >=0.5; altrimenti 0.
  function asdSim(a,b){
    var na=normASD(a),nb=normASD(b);
    var lev=similarity(na,nb);
    if(lev>=0.70)return lev;
    var wa=na.split(' ').filter(function(w){return w.length>=3&&STOP.indexOf(w)<0;});
    var wb=nb.split(' ').filter(function(w){return w.length>=3&&STOP.indexOf(w)<0;});
    if(!wa.length||!wb.length)return 0;
    var wbSet={};wb.forEach(function(w){wbSet[w]=true;});
    var common=wa.filter(function(w){return wbSet[w];}).length;
    if(common<2)return 0; // almeno 2 parole significative in comune per evitare falsi positivi
    var jac=common/(wa.length+wb.length-common);
    return jac>=0.5?jac:0;
  }
  var parent={};
  all.forEach(function(a){parent[a]=a;});
  function find(a){if(parent[a]!==a)parent[a]=find(parent[a]);return parent[a];}
  function unite(a,b){var ra=find(a),rb=find(b);if(ra!==rb)parent[ra]=rb;}
  for(var i=0;i<all.length;i++){
    for(var j=i+1;j<all.length;j++){
      var ai=all[i],aj=all[j];
      var ci=getASDCircuito(ai),cj=getASDCircuito(aj);
      if(ci!=='nd'&&cj!=='nd'&&ci!==cj)continue;
      if(asdSim(ai,aj)>=0.5)unite(ai,aj);
    }
  }
  var gMap={};
  all.forEach(function(a){var r=find(a);if(!gMap[r])gMap[r]=[];gMap[r].push(a);});
  var ignored=getIgnoredASDGroups();
  return Object.values(gMap).filter(function(g){
    if(g.length<=1)return false;
    // FIX 8: nascondi i gruppi GIÀ unificati — se tutti i membri puntano già allo stesso
    // nome canonico, il problema è risolto e non ha senso continuare a segnalarlo.
    var canons=g.map(function(a){return getASDCanonicalName(a);});
    var allSame=canons.every(function(c){return c===canons[0];});
    if(allSame)return false;
    // FIX 9: nascondi i gruppi marcati come falsi positivi dall'utente
    if(ignored.indexOf(asdGroupKey(g))>=0)return false;
    return true;
  }).map(function(g){
    // Prefer already-set canonical; then prefer mixed-case over ALL-CAPS; then longest
    var existCanon=null;
    g.forEach(function(a){var c=ASD_CANON[a];if(c&&c!==a&&!existCanon)existCanon=c;});
    var canon=existCanon||g.reduce(function(best,a){
      var bCaps=best===best.toUpperCase(),aCaps=a===a.toUpperCase();
      if(bCaps&&!aCaps)return a;if(!bCaps&&aCaps)return best;
      return a.length>best.length?a:best;
    },g[0]);
    return {canonical:canon,members:g.slice().sort()};
  });
}

async function applyASDGroup(idx,btn){
  var g=_asdGroups[idx];if(!g)return;
  var inp=document.getElementById('asd-grp-'+idx);
  var canon=inp?inp.value.trim():g.canonical;
  if(!canon)return;
  if(btn){btn.textContent='…';btn.disabled=true;}
  for(var k=0;k<g.members.length;k++){
    if(g.members[k]!==canon)await saveASDCanonical(g.members[k],canon);
  }
  renderASD();
}

async function applyAllASDGroups(btn){
  if(btn){btn.textContent='…';btn.disabled=true;}
  for(var i=0;i<_asdGroups.length;i++){
    var inp=document.getElementById('asd-grp-'+i);
    var canon=inp?inp.value.trim():_asdGroups[i].canonical;
    if(!canon)continue;
    var g=_asdGroups[i];
    for(var k=0;k<g.members.length;k++){
      if(g.members[k]!==canon)await saveASDCanonical(g.members[k],canon);
    }
  }
  renderASD();
}

async function resetAllCanonicals(btn){
  if(!confirm('Cancellare tutti i nomi canonici? I raggruppamenti manuali andranno persi.'))return;
  if(btn){btn.textContent='…';btn.disabled=true;}
  var all=getAllASD();
  for(var i=0;i<all.length;i++){await saveASDCanonical(all[i],null);}
  renderASD();
}

function expCSV(){
  var cir=clState.circuit,cat=clState.cat;
  var rows=getStandings(cir,cat);
  var lines=[['POS','Atleta/Coppia','ASD','Tappe','Totale'].join(';')];
  rows.forEach(function(r){lines.push([r.pos,r.display,r.assoc,r.stages.length,r.total].join(';'));});
  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=expFilename('csv');a.click();
}

function expXLS(){
  var cir=clState.circuit,cat=clState.cat;
  var rows=getStandings(cir,cat);
  var catObj=CATS.find(function(c){return c.id===cat;});
  var stgs=STAGES.filter(function(s){return s.circuits.indexOf(cir)>=0&&s.id!=='san-dona';});
  var data=[['POS','Atleta/Coppia','ASD','Tappe','Totale'].concat(stgs.map(function(s){return s.name+(s.jollyFor.indexOf(cir)>=0?'(J)':'');}))];
  rows.forEach(function(r){var spts=stgs.map(function(s){var sp=null;for(var k=0;k<r.stages.length;k++){if(r.stages[k].stageId===s.id){sp=r.stages[k];break;}}return sp?sp.ptsUsed:'';});data.push([r.pos,r.display,r.assoc,r.stages.length,r.total].concat(spts));});
  var wb=XLSX.utils.book_new();var ws=XLSX.utils.aoa_to_sheet(data);XLSX.utils.book_append_sheet(wb,ws,catObj.name.substring(0,31));XLSX.writeFile(wb,expFilename('xlsx'));
}

function expFilename(ext){
  var cirName=CIR[clState.circuit].name.replace(/\s/g,'-').replace(/[^\w-]/g,'');
  var catLabel;
  if(clState.showASD){
    catLabel='Classifica-ASD';
  } else {
    var catObj=CATS.find(function(c){return c.id===clState.cat;});
    catLabel=catObj?catObj.name.replace(/\s/g,'-').replace(/[^\w-]/g,''):'';
  }
  var date=new Date().toISOString().split('T')[0];
  return 'NWS2026_'+cirName+'_'+catLabel+'_'+date+'.'+ext;
}

/* ---- EXPORT IMMAGINE / PDF -------------------------------------------
   Il rendering NON usa più l'elemento a schermo (che su mobile viene
   schiacciato e produce testo illeggibile): il contenuto viene clonato in
   un contenitore fuori schermo di larghezza fissa, così l'export è identico
   da telefono e da PC. Oltre le 25 righe la classifica viene divisa in più
   parti, ognuna con intestazione, titolo e nota ripetuti.               */
var EXP_WIDTH=1400;      // larghezza di rendering in px
var EXP_SCALE=3;         // moltiplicatore di risoluzione
var EXP_ROWS_PER_PAGE=22;// righe per parte

function expChunks(){
  var el=document.getElementById('exp-wrap');
  if(!el)return null;
  var tbl=el.querySelector('table');
  if(!tbl)return [null];
  var n=tbl.querySelectorAll('tbody tr').length;
  if(n<=25)return [null];
  var out=[];
  for(var i=0;i<n;i+=EXP_ROWS_PER_PAGE)out.push([i,Math.min(i+EXP_ROWS_PER_PAGE,n)]);
  return out;
}

function expRender(range,part,total){
  return new Promise(function(resolve,reject){
    var src=document.getElementById('exp-wrap');
    if(!src){reject(new Error('exp-wrap assente'));return;}
    var host=document.createElement('div');
    host.style.cssText='position:fixed;left:-20000px;top:0;width:'+EXP_WIDTH+'px;background:#fff;padding:24px;box-sizing:border-box;z-index:-1';
    var clone=src.cloneNode(true);
    clone.style.width='100%';
    var tw=clone.querySelector('.tw');
    if(tw){tw.style.overflow='visible';tw.style.overflowX='visible';}
    var tb=clone.querySelector('table');
    if(tb)tb.style.minWidth='0';
    if(range){
      var trs=Array.prototype.slice.call(clone.querySelectorAll('tbody tr'));
      trs.forEach(function(tr,i){if(i<range[0]||i>=range[1])tr.parentNode.removeChild(tr);});
      var ttl=clone.querySelector('span');
      if(ttl)ttl.textContent=ttl.textContent+'  ·  parte '+part+'/'+total+'  ('+(range[0]+1)+'\u2013'+range[1]+')';
    }
    host.appendChild(clone);
    document.body.appendChild(host);
    html2canvas(host,{backgroundColor:'#ffffff',scale:EXP_SCALE,width:EXP_WIDTH,windowWidth:EXP_WIDTH}).then(function(canvas){
      if(host.parentNode)host.parentNode.removeChild(host);
      resolve(canvas);
    }).catch(function(e){
      if(host.parentNode)host.parentNode.removeChild(host);
      reject(e);
    });
  });
}

function expImg(){
  if(typeof html2canvas==='undefined')return;
  var chunks=expChunks();
  if(!chunks)return;
  var base=expFilename('png').replace(/\.png$/,'');
  var i=0;
  function step(){
    if(i>=chunks.length)return;
    expRender(chunks[i],i+1,chunks.length).then(function(canvas){
      var a=document.createElement('a');
      a.href=canvas.toDataURL('image/png');
      a.download=(chunks.length>1)?base+'_parte'+(i+1)+'di'+chunks.length+'.png':base+'.png';
      a.click();
      i++;
      setTimeout(step,700);
    }).catch(function(e){console.error('Export immagine:',e);alert('Errore durante l\'export immagine.');});
  }
  step();
}

function expPDF(){
  if(typeof html2canvas==='undefined'||typeof jspdf==='undefined')return;
  var chunks=expChunks();
  if(!chunks)return;
  var pdfLib=jspdf;
  var pdf=new pdfLib.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  var w=pdf.internal.pageSize.getWidth();
  var i=0;
  function step(){
    if(i>=chunks.length){pdf.save(expFilename('pdf'));return;}
    expRender(chunks[i],i+1,chunks.length).then(function(canvas){
      if(i>0)pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,w,canvas.height*w/canvas.width);
      i++;
      step();
    }).catch(function(e){console.error('Export PDF:',e);alert('Errore durante l\'export PDF.');});
  }
  step();
}

function expFullDB(){
  var wb=XLSX.utils.book_new();
  Object.keys(DB.results).forEach(function(key){
    var r=DB.results[key];
    var st=STAGES.find(function(s){return s.id===r.stageId;});
    var cat=CATS.find(function(c){return c.id===r.catId;});
    if(!st||!cat)return;
    var isCop=cat.type==='cop';
    var hdr=isCop?['POS','P1','P2','ASD','Tot','Punti']:['POS','Cognome','Nome','ASD','Tot','Punti'];
    var data=[hdr].concat(r.rows.map(function(row){return isCop?[row.pos,row.p1||'',row.p2||'',row.assoc||'',row.tot||'',row.pts||'']:[row.pos,row.cognome||'',row.nome||'',row.assoc||'',row.tot||'',row.pts||''];}));
    var ws=XLSX.utils.aoa_to_sheet(data);XLSX.utils.book_append_sheet(wb,ws,(st.name+' '+cat.short).substring(0,31));
  });
  if(!wb.SheetNames.length){alert('Nessun dato da esportare');return;}
  XLSX.writeFile(wb,'NWS2026_DB_'+new Date().toISOString().split('T')[0]+'.xlsx');
}
